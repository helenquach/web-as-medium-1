<!DOCTYPE html><!--document type declaration-->
<html>
    <head><!-- a container for metadata -->
        <meta charset="utf-8"><!--charset: character encoding capable of encoding all characters on the web  -->
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"><!--for browser compatibility: choose rendering engine to view the page in an correct view (for old ver. IE)  -->
        <title>bbb</title><!--declaring the title, or name, of the HTML document. displayed in the browser's title bar-->
        <meta name="description" content=""><!--keywords/snippet for search engines-->
        <meta name="viewport" content="width=device-width"><!--the browser will (probably) render the width of the page at the width of its own screen -->
        <link rel="stylesheet" href="style.css">
    </head>
    <body><!--all the contents of an HTML document goes here-->
      <div class="b1">
        <div class="background red"></div>
        <div class="upper-bowl red circle">
          <div class="counter black circle"></div>
          <div class="counter black"></div>
        </div>
        <div class="lower-bowl red circle">
          <div class="counter black circle"></div>
          <div class="counter black"></div>
        </div>
        <div class="waist red"></div>
        <div class="stem red circle">
          <div class="stem black circle"></div>
        </div>
        <div class="foreground black"></div>
        <div class="top-serif red"></div>
        <div class="bottom-serif red"></div>
      </div>
      <div class="b2">
        <div class="upper-bowl white circle"></div>
        <div class="lower-bowl white circle"></div>
        <div class="stem white"></div>
        <div class="counter black"></div>
        <div class="counter black"></div>
        <div class="counter black"></div>
        <div class="counter black"></div>
        <div class="counter black"></div>
        <div class="counter black"></div>
        <div class="counter black"></div>
        <div class="counter black"></div>
        <div class="top-serif white"></div>
        <div class="bottom-serif white"></div>
        <div class="top-serif black circle"></div>
        <div class="bottom-serif black circle"></div>
      </div>
      <div class="b3-wrapper">
        <div class="b3">
          <div class="stem grey"></div>
          <div class="crossbars">
            <div class="crossbar grey"></div>
            <div class="crossbar grey"></div>
            <div class="crossbar grey"></div>
          </div>
          <div class="diagonal grey"></div>
          <div class="diagonal grey"></div>
          <div class="diagonal grey"></div>
          <div class="diagonal grey"></div>
          <div class="upper-bowl grey"></div>
          <div class="lower-bowl grey"></div>
        </div>
      </div>
      <div class="gradient"></div>
    </body>
</html>
